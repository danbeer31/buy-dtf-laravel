name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  laravel-tests:
    name: Laravel tests (PHP 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      FUEL_DB_CONNECTION: sqlite
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rehearse operations safety artifacts
        shell: bash
        run: |
          python3 ops/deployment/payout_notes_correction.py \
            --self-check \
            --repo-root "$GITHUB_WORKSPACE"
          python3 ops/deployment/atomic_dependency_deploy.py \
            --rehearse \
            --rehearsal-parent "$RUNNER_TEMP"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Lint dependency runtime helper
        run: php -l ops/deployment/dependency_runtime_probe.php

      - name: Audit locked PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Install locked PHP dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked

      - name: Run isolated Laravel tests
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/phpunit --colors=never 2>&1 | tee "$RUNNER_TEMP/phpunit.log"

      - name: Surface PHPUnit failure
        if: failure()
        shell: bash
        run: |
          if [[ ! -f "$RUNNER_TEMP/phpunit.log" ]]; then
            exit 0
          fi

          details="$(tail -n 100 "$RUNNER_TEMP/phpunit.log")"
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error file=phpunit.xml,line=1,title=PHPUnit failed::$details"

  frontend-build:
    name: Production frontend build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production assets
        run: npm run build
